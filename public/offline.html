<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fără conexiune</title>
    <meta name="theme-color" content="#1C1917" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f6f4f0;
        color: #1c1917;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        font-size: 16px;
        line-height: 1.4;
        color: #57534e;
        margin: 0 0 24px;
      }
      button {
        min-height: 48px;
        padding: 12px 24px;
        border: 0;
        border-radius: 12px;
        background: #1c1917;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nu ai conexiune la internet</h1>
      <p>Verifică rețeaua și încearcă din nou. Programările tale sunt în siguranță.</p>
      <button type="button" onclick="location.reload()">Încearcă din nou</button>
    </main>
  </body>
</html>
